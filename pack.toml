# funsearch — evolutionary program search for Gas City.
#
# A small coding agent, the mutator, writes new candidate programs.
# A user-supplied evaluator scores them through a C interface.
# Evaluators may be implemented in any language behind that interface.
# The worker hosts evaluator libraries and loads one candidate at a time.
# The Python engine manages programs, islands, tasks, and worker processes.
# Candidates evolve through scored parent sampling and island resets.
# Each problem supplies its own specification, seed, and evaluator.
# The pack is project-agnostic and can be imported into any rig.
# Gas City formulas and hooks connect runs to mutator slot beads.
# Run state belongs to the problem directory and is never committed.
# The bundled cap-set example demonstrates a Julia-backed evaluator.
# Mutators default to Claude Haiku; an optional guarded Codex pool uses gpt-6-luna.
# Implemented under epic mc-h4zx; see README.md for the layout and status.

[pack]
name = "funsearch"
schema = 2

# Guarded Codex mutator provider. Its family resolves to builtin codex, so Gas
# City projects the effective MCP into the agent WorkDir, outside the model's
# slot/. The launcher drops every gc-appended argument (no "$@" forwarding);
# codex_mutator_launch.py fixes its own Codex flags, sandbox mode and model.
[providers.funsearch-codex]
base = "builtin:codex"
command = "./.funsearch-codex-launch"
path_check = "sh"
resume_command = "./.funsearch-codex-launch"
